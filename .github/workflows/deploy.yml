name: Test Branch Deploy

on:
  push:
    branches: [ test ]

jobs:
  build-and-run:
    runs-on: self-hosted

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Eski container'ları durdur
        run: docker compose down

      - name: Build al ve ayağa kaldır
        run: docker compose up -d --build