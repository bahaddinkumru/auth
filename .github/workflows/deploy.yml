name: CI/CD Pipeline

on:
  push:
    branches: [ test, prod ]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Unit testleri çalıştır
        run: ./mvnw clean test

  deploy:
    needs: test
    runs-on: self-hosted
    environment: ${{ github.ref_name }}
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: .env dosyasını oluştur
        shell: powershell
        run: |
          $envContent = @"
          SPRING_PROFILES_ACTIVE=${{ github.ref_name }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          "@
          [System.IO.File]::WriteAllText("$PWD\.env", $envContent, [System.Text.Encoding]::UTF8)

      - name: Eski container'ları durdur
        run: docker compose down

      - name: Build al ve ayağa kaldır
        run: docker compose --env-file .env up -d --build

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 15
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8081/api/v1/actuator/health" -UseBasicParsing
            if ($response.StatusCode -ne 200) {
              Write-Error "Health check başarısız, status code: $($response.StatusCode)"
              exit 1
            }
            Write-Host "Health check başarılı: $($response.Content)"
          } catch {
            Write-Error "Health check başarısız: $_"
            exit 1
          }