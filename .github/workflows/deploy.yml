name: CI/CD Pipeline

on:
  push:
    branches: [ test, prod ]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Unit testleri çalıştır
        run: ./mvnw clean test

  deploy:
    needs: test
    runs-on: self-hosted
    environment: ${{ github.ref_name }}
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: .env dosyasını oluştur
        shell: powershell
        run: |
          $envContent = @"
          SPRING_PROFILES_ACTIVE=${{ github.ref_name }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          "@
          [System.IO.File]::WriteAllText("$PWD\.env", $envContent, [System.Text.Encoding]::UTF8)

      - name: Yeni imajı build al
        run: docker compose --env-file .env build

      - name: Container'ları ayağa kaldır
        run: docker compose --env-file .env up -d

      - name: Health check (Runner Üzerinden)
        shell: powershell
        run: |
          $endpoint = "http://localhost:8081/api/v1/actuator/health"
          Write-Host "Uygulamanın ayağa kalkması bekleniyor..."
          
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $endpoint -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "Uygulama ayakta ve HTTP 200 yanıtı verdi!"
                exit 0
              }
            } catch {
              Write-Host "Deneme $i/30 başarısız. 5 saniye bekleniyor..."
            }
            Start-Sleep -Seconds 5
          }
          
          Write-Error "Uygulama zaman aşımına uğradı."
          exit 1