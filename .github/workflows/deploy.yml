name: CI/CD Pipeline

on:
  push:
    branches: [ test, prod ]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Unit testleri çalıştır
        run: ./mvnw clean test

  deploy:
    needs: test
    runs-on: self-hosted
    environment: ${{ github.ref_name }}
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: .env dosyasını oluştur
        shell: powershell
        run: |
          $envContent = @"
          SPRING_PROFILES_ACTIVE=${{ github.ref_name }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          "@
          [System.IO.File]::WriteAllText("$PWD\.env", $envContent, [System.Text.Encoding]::UTF8)

      - name: Eski container'ları durdur
        run: docker compose down

      - name: Build al ve ayağa kaldır
        run: docker compose --env-file .env up -d --build

      - name: Health check
        shell: powershell
        run: |
          $maxAttempts = 15
          $delaySeconds = 5
          $healthy = $false

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Health check denemesi $i/$maxAttempts..."
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8081/api/v1/actuator/health" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "Uygulama ayakta: $($response.Content)"
                $healthy = $true
                break
              }
            } catch {
              Write-Host "Henüz hazır değil, $delaySeconds sn bekleniyor..."
            }
            Start-Sleep -Seconds $delaySeconds
          }

          if (-not $healthy) {
            Write-Error "Uygulama $($maxAttempts * $delaySeconds) saniye içinde ayağa kalkmadı."
            docker compose logs app --tail 50
            exit 1
          }