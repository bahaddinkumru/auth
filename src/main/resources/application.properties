spring.application.name=auth
server.port=8081

server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reopiya_auth_db}
spring.datasource.username=${DB_USER:reopiya_user}
spring.datasource.password=${DB_PASSWORD:reopiya_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.access.secret=${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.refresh.secret=${JWT_REFRESH_SECRET:8F4428472B4B6250655368566D597133743677397A24432646294A404E635266}

jwt.access.expiration-ms=900000
jwt.refresh.expiration-ms=604800000
jwt.refresh.expiration-days=7